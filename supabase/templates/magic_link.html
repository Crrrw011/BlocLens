<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6fb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f6fb; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);">
            <tr>
              <td style="background-color: #0d6efd; padding: 24px 32px; text-align: center;">
                <span style="font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px;">BlocLens</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                <h1 style="font-size: 20px; font-weight: 600; color: #1a1a2e; margin: 0 0 12px;">Your sign-in code</h1>
                <p style="font-size: 15px; line-height: 1.6; color: #4a4a5a; margin: 0 0 8px;">Use the code below to log in to BlocLens. It expires shortly and can only be used once.</p>
                <div style="margin: 24px 0; text-align: center;">
                  <span style="display: inline-block; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #0d6efd; background-color: #eef3ff; padding: 14px 24px; border-radius: 12px;">{{ .Token }}</span>
                </div>
                <p style="font-size: 13px; line-height: 1.6; color: #8a8a9a; margin: 0;">If you didn't request this code, you can safely ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px; background-color: #f9fafc; border-top: 1px solid #eceef3;">
                <p style="font-size: 12px; line-height: 1.5; color: #9a9aa8; margin: 0; text-align: center;">BlocLens · A climbing tool. Sent to {{ .Email }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
